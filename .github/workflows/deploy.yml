name: Bygg och publicera

# Produktionsgren. Byter du namn på grenen (t.ex. till "main") ändrar du raden
# nedan — och motsvarande rad i kontroll.yml.
on:
  push:
    branches: ["claude/website-automation-o26eu3"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Bygg sidan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bygg
        run: npm run build

      # enablement: true slår på GitHub Pages automatiskt första gången,
      # så sidan kan publiceras utan att någon ställer in det för hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicera till GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
